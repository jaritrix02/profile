<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.96); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .pulse-circle { animation: pulse 2.5s infinite ease-in-out; }
      .floating { animation: float 4s infinite ease-in-out; }
      .code-font { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .title-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="20" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="90" r="140" fill="#38bdf8" fill-opacity="0.08" filter="url(#neonGlow)" />
  <circle cx="1050" cy="320" r="160" fill="#818cf8" fill-opacity="0.08" filter="url(#neonGlow)" />

  <!-- Subtle Border Glow -->
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- LEFT SIDE: Developer Identity & Taglines -->
  <g transform="translate(70, 75)">
    <!-- Status Pill -->
    <g>
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="5" fill="#10b981" class="pulse-circle" />
      <circle cx="18" cy="17" r="9" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4" />
      <text x="36" y="22" fill="#94a3b8" font-size="12" class="code-font" font-weight="600" letter-spacing="0.5">OPEN FOR WORK &amp; COLLAB</text>
    </g>

    <!-- Main Heading -->
    <text x="0" y="95" fill="#f8fafc" font-size="44" class="title-font" font-weight="800" letter-spacing="-0.5">
      Full-Stack Developer <tspan fill="#38bdf8">👨‍💻</tspan>
    </text>

    <!-- Dynamic Subtitle -->
    <text x="0" y="135" fill="url(#primaryGrad)" font-size="22" class="code-font" font-weight="600">
      &gt; Architecting scalable web applications &amp; modern UIs
    </text>

    <!-- Brief Description -->
    <text x="0" y="175" fill="#94a3b8" font-size="15" class="title-font" font-weight="400">
      Specializing in MERN Stack, Next.js, TypeScript, and high-performance full-stack architectures.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 210)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="115" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" />
        <text x="57" y="20" fill="#38bdf8" font-size="12" class="code-font" font-weight="600" text-anchor="middle">⚡ High Speed</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(125, 0)">
        <rect width="130" height="32" rx="8" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" />
        <text x="65" y="20" fill="#a5b4fc" font-size="12" class="code-font" font-weight="600" text-anchor="middle">🔒 Clean Code</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(265, 0)">
        <rect width="135" height="32" rx="8" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" />
        <text x="67" y="20" fill="#e879f9" font-size="12" class="code-font" font-weight="600" text-anchor="middle">🎨 Modern UI/UX</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SIDE: Male Developer Coding Terminal & Workspace Illustration -->
  <g transform="translate(710, 50)" class="floating">
    <!-- Window / IDE Box -->
    <rect width="420" height="300" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#dropShadow)" />

    <!-- Terminal Header Bar -->
    <rect width="420" height="38" rx="14" fill="#0f172a" />
    <path d="M 0 38 L 420 38" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Window Control Buttons -->
    <circle cx="22" cy="19" r="6" fill="#ef4444" opacity="0.85" />
    <circle cx="40" cy="19" r="6" fill="#f59e0b" opacity="0.85" />
    <circle cx="58" cy="19" r="6" fill="#10b981" opacity="0.85" />

    <text x="210" y="24" fill="#64748b" font-size="12" class="code-font" font-weight="500" text-anchor="middle">developer.config.ts</text>

    <!-- Code Snippet Area -->
    <g transform="translate(24, 65)" class="code-font" font-size="13">
      <text y="0" fill="#64748b">1</text>
      <text x="30" y="0">
        <tspan fill="#f43f5e">const</tspan> <tspan fill="#38bdf8">developer</tspan> = {
      </text>

      <text y="24" fill="#64748b">2</text>
      <text x="30" y="24">
        &nbsp;&nbsp;<tspan fill="#94a3b8">name:</tspan> <tspan fill="#a5b4fc">"Full-Stack Engineer"</tspan>,
      </text>

      <text y="48" fill="#64748b">3</text>
      <text x="30" y="48">
        &nbsp;&nbsp;<tspan fill="#94a3b8">gender:</tspan> <tspan fill="#38bdf8">"Male (He/Him)"</tspan>,
      </text>

      <text y="72" fill="#64748b">4</text>
      <text x="30" y="72">
        &nbsp;&nbsp;<tspan fill="#94a3b8">passions:</tspan> [<tspan fill="#34d399">"Code"</tspan>, <tspan fill="#34d399">"Architecture"</tspan>, <tspan fill="#34d399">"UI"</tspan>],
      </text>

      <text y="96" fill="#64748b">5</text>
      <text x="30" y="96">
        &nbsp;&nbsp;<tspan fill="#94a3b8">stack:</tspan> [<tspan fill="#facc15">"React"</tspan>, <tspan fill="#38bdf8">"Node"</tspan>, <tspan fill="#34d399">"Mongo"</tspan>],
      </text>

      <text y="120" fill="#64748b">6</text>
      <text x="30" y="120">
        &nbsp;&nbsp;<tspan fill="#94a3b8">streak:</tspan> <tspan fill="#f97316">"Unstoppable 🔥"</tspan>
      </text>

      <text y="144" fill="#64748b">7</text>
      <text x="30" y="144">};</text>

      <text y="174" fill="#64748b">8</text>
      <text x="30" y="174">
        <tspan fill="#38bdf8">developer</tspan>.<tspan fill="#818cf8">buildCoolThings</tspan>();
      </text>
    </g>

    <!-- Mini Bottom Status Pill inside Card -->
    <rect x="24" y="258" width="372" height="26" rx="6" fill="#090d16" stroke="#1e293b" />
    <circle cx="38" cy="271" r="3.5" fill="#38bdf8" />
    <text x="50" y="275" fill="#64748b" font-size="11" class="code-font">master*  ● 0 errors  ▲ 0 warnings</text>
  </g>
</svg>
